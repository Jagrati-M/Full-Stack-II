<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Quiz Arena</title>
    <link rel="stylesheet" href="task1.css">
</head>
<body>
    <div class="container">
        <h1>JS Quiz Arena</h1>
        <div class="quiz">
            <span id="progress">Q 1/5</span>
            <span id="score">Score: 0</span>
        </div>
        <h2 id="question">Question Appears Here</h2>
        <div id="options">
            <button class="option">Option 1</button>
            <button class="option">Option 2</button>
            <button class="option">Option 3</button>
            <button class="option">Option 4</button>
        </div>
        <div id="explanation"></div>
        <button id="nextButton">Next Question</button>
    </div>
    <script src="task1.js"></script>
</body>
</html>
