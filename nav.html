<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav{
            display: flex;
            height: 10%;
            flex-wrap: wrap;

        }

</head>

    <nav>
        <img src="8_1sasa11.jpg">
