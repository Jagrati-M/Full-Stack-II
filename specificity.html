<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specificity</title>
    <style>
        /*writing special, base says: Lower priority -----------------------------> Higher priority.  */
        @layer special, base;

        @layer base {
            body{
                background-color: white;
            }
            p {
                font-size: 30px;
                color: red;
            }

            button {
                font-size: 30px;
                border-radius: 50%;
                width: 150px;
                height: 150px;
                background-color: white;
                border: 1px solid grey;
                box-shadow: 10px 10px 20px grey;
            }

            button:active {
                box-shadow: inset 10px 10px 20px grey;
            }
        }

        @layer special {
            body {
                background-color: black;
            }

            p {
                color: violet;
            }

            button {
                border: 1px solid white;
                box-shadow: inset 10px 10px 20px white;
            }

            button:active {
                box-shadow: 10px 10px 20px grey;
            }
        }
    </style>
</head>

<body>
    <p>Specificity</p>
    <button>Click Me!</button>
</body>

</html>
