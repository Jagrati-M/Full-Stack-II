<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <style>
        @font-face {
            font-family: "WinterSong";
            src: url("./fonts/WinterSong.ttf");
        }
        .container {
            display: grid;
            gap: 3%;
            height: 100vh;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            grid-template-areas:
                "box1 box1 box1 box1 box1 box1 box1"
                "box2 box3 box3 box4 box4 box5 box5"
                "box2 box7 box7 box8 box8 box9 box9"
                "box2 box10 box10 box10 box11 box11 box11"
                "box2 box10 box10 box10 box11 box11 box11 "
                "box6 box6 box6 box6 box6 box6 box6";
        }

        @media (max-width:900px) {
            .container {
                grid-template-areas:
                    "box1 box1 box1"
                    "box2 box2 box2"
                    "box3 box4 box5"
                    "box7 box8 box9"
                    "box10 box10 box11"
                    "box10 box10 box11"
                    "box6 box6 box6";
            }

        }

        @media (max-width:500px) {
            .container {
                grid-template-areas:
                    "box1 box1 box1"
                    "box2 box2 box2"
                    "box3 box3 box3"
                    "box4 box4 box4"
                    "box5 box5 box5"
                    "box7 box7 box7"
                    "box8 box8 box8"
                    "box9 box9 box9"
                    "box10 box10 box10"
                    "box11 box11 box11"
                    "box6 box6 box6";
            }

        }

        .box {
            min-height: 150px;
            background-color: palevioletred;
            outline: 2px solid midnightblue;
            min-width: 100px;
            border-radius: 10px;
            padding: 10px;
            font-family: WinterSong;
            font-weight: bold;
            font-size: 30px;
            text-align: center;
        }
        h2{
            font-family: WinterSong;
        }
    </style>
</head>

<body>
    <h2>DashBoard Layout</h2>
    <div class="container">
        <div class="box" style="grid-area: box1;">Header</div>
        <div class="box" style="grid-area: box2;">SideBar</div>
        <div class="box" style="grid-area: box3;">Stat</div>
        <div class="box" style="grid-area: box4;">Stat</div>
        <div class="box" style="grid-area: box5;">Stat</div>
        <div class="box" style="grid-area: box7;">Stat</div>
        <div class="box" style="grid-area: box8;">Stat</div>
        <div class="box" style="grid-area: box9;">Stat</div>
        <div class="box" style="grid-area: box10;">Recent Orders</div>
        <div class="box" style="grid-area: box11;">Activity</div>
        <div class="box" style="grid-area: box6;">Footer</div>
    </div>
</body>

</html>
