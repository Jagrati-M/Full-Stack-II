<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Cards</title>
    <style>
        .fixed {
            position: fixed;
            left: 50%;
            text-align: center;
            font-size: 45px;
            background: linear-gradient(rgb(185, 48, 223), white);
            background-clip: text;
            color: transparent;
            font-weight: 700;
            -webkit-text-stroke-color: black;
            -webkit-text-stroke-width: 2px;

        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .box {
            display: flex;
            width: 900px;
            height: 700px;
            color: white;
            font-weight: 100;
            text-align: center;
            top:20%;
        }


        #box1 {
            position: sticky;
            /* left: 40%; */
            box-shadow: 10px 10px 10px #000000;

        }

        #box2 {
            position: sticky;
            /* left: 30%; */
        }

        #box3 {
            position: sticky;
            /* left: 20%; */
        }

        #box4 {
            position: sticky;
            /* left: 10%; */
            box-shadow: 10px 10px 10px #000000;
        }

        #box5 {
            position: sticky;
            /* left: 20%; */
        }

        #box6 {
            position: sticky;
            /* left: 30%; */
        }

        #box7 {
            position: sticky;
            /* left: 40%; */
        }
    </style>

</head>

<body>
    <div class="container">
        <div class="fixed">Colour Cards</div>
        <div class="box" id="box1" style="background-color:powderblue;">1</div>
        <div class="box" id="box2" style="background-color:cadetblue;">2</div>
        <div class="box" id="box3" style="background-color:cornflowerblue;">3</div>
        <div class="box" id="box4" style="background-color:slateblue;">4</div>
        <div class="box" id="box5" style="background-color: blue;">5</div>
        <div class="box" id="box6" style="background-color:darkblue;">6</div>
        <div class="box" id="box7" style="background-color:midnightblue;">7</div>
    </div>
</body>

</html>
