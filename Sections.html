<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @font-face {
            font-family: "HappyFestive";
            src: url("./fonts/HappyFestive.ttf");
        }
        section h2{
            color: cadetblue;
            font-family: HappyFestive;
            font-size: 60px;
        }
        h2~p{
            color: brown;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        section>h2{
            text-transform: lowercase;
        }
        .para{
            color: aquamarine;
        }
        #mypara{
            color: blueviolet;
        }
        p{
            color: bisque;
        }
    </style>
</head>
<body>
    <section>
        <h2>Happy New day!!</h2>
        <p>Para 1</p>
        <p>Para 2</p>
    </section>
    <div>
        <h2>Heading 2</h2>
        <p class="para" id="mypara">Hello World</p>
    </div>
</body>
</html>
