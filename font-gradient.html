<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: rgb(131, 128, 128);
            margin-left: 10%;
            filter: drop-shadow(-26px 10px 10px black);
            box-shadow: inset 15px -11px 11px 1px #504d4d;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <p style="
        font-size: 100px; 
        text-align: center;
        background: linear-gradient(rgb(185, 48, 223), white); 
        background-clip: text; color:transparent; 
        font-weight: 700;
        -webkit-text-stroke-color:black;
        -webkit-text-stroke-width: 2px;
        text-shadow: -13px 1px 6px purple;">
        BOX
    </p>
    <div class="box"></div>
</body>

</html>
