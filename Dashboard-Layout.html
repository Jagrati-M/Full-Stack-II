<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        .container {
            display: grid;
            gap: 3%;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            grid-template-areas:
                "box1 box1 box1 box1"
                "box3 box4 box4 box2"
                "box3 box4 box4 box2"
                "box3 box5 box6 box2"
                "box3 box5 box6 box2"
                "box7 box7 box7 box7"
                /* "box11 box12 box12"; */
        }

        /* @media (max-width:500px) {
            .container {
                grid-template-areas:
                    "box1 box2 box3 box4"
                    "box5 box6 box7 box8"
                    "box9 box10 box11 box12";
            }

        } */
        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color:darkmagenta;
            color: aliceblue;
            font-size: large;
            min-height: 100px;

        }
    </style>
</head>

<body>
    <H1 style="text-align: center">Dashboard</H1>
    <div class="container">
        <div class="box" style="grid-area: box1;">Header</div>
        <div class="box" style="grid-area: box2;">Side Panel</div>
        <div class="box" style="grid-area: box3;">Navigation</div>
        <div class="box" style="grid-area: box4;">Display</div>
        <div class="box" style="grid-area: box5;">Card 1</div>
        <div class="box" style="grid-area: box6;">Card 2</div>
        <div class="box" style="grid-area: box7;">Footer</div>
        <!-- <div class="box" style="grid-area: box8;"></div>
        <div class="box" style="grid-area: box9;"></div>
        <div class="box" style="grid-area: box10;"></div>
        <div class="box" style="grid-area: box11;"></div>
        <div class="box" style="grid-area: box12;"></div> -->
    </div>
</body>

</html>
