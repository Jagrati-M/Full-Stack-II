    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            /* Lets cards drop to the next line */
            gap: 20px;
            /* Space between the cards */
            justify-content: center;
            /* Centers the cards in the row */
            padding: 20px;
        }

        .card {
            width: 220px;
            /* Fixed base width for each card */
            border: 0px solid #ddd;
            border-radius: 8px;
            margin-top: 2px;
            padding: 15px;
            text-align: center;
            background-color: #fff;
        }

        .product-card img {
            width: 100%;
            /* Makes image fit the card width */
            height: auto;
            border-radius: 4px;
        }
    </style>
</head>
