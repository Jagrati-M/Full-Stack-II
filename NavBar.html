<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, 
                   initial-scale=1.0">
    <style>
        body{
            background-color: aliceblue;
        }
        .navbar {
            display: flex;
            background-color: #333;
            /* height: 97vh; */
            justify-content: space-between;
            align-items: center;
        }
        .Logo {
            display: flex;
            padding: 14px 20px;
            justify-content: space-between;
            color: whitesmoke;
            flex: 1;
        }
        .logo>img{

            width: 50px;

            color: white;
            padding: 14px 20px;
            text-decoration: none;
            text-align: center;
        }
        a:focus{
            background-color: blue;
        }
        a:hover{
            background-color: green;
        }

</head>
